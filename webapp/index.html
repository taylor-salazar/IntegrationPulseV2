<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Integration Pulse</title>

	<!--
		Local BAS development uses the UI5 tooling/framework configuration in ui5.yaml.
		The deployed HTML5 application loads the OpenUI5 1.120.20 runtime from the
		official OpenUI5 CDN. The version remains explicitly pinned for reproducibility.
	-->
	<script
		id="sap-ui-bootstrap"
		src="https://sdk.openui5.org/1.120.20/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-resourceroots='{ "integrationpulse": "./" }'
		data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true"
		data-sap-ui-frameOptions="trusted">
	</script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
	<div
		data-sap-ui-component
		data-name="integrationpulse"
		data-id="container"
		data-settings='{ "id": "integrationpulse" }'>
	</div>
</body>
</html>
