<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Integration Pulse</title>

	<!--
		Local BAS development serves OpenUI5 through the UI5 tooling/framework configuration.
		The CF build packages the pinned OpenUI5 1.120.20 runtime under resources/ in
		the application ZIP, so deployment does not depend on CDN version availability.
	-->
	<script
		id="sap-ui-bootstrap"
		src="resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-resourceroots='{ "integrationpulse": "./" }'
		data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true"
		data-sap-ui-frameOptions="trusted">
	</script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
	<div
		data-sap-ui-component
		data-name="integrationpulse"
		data-id="container"
		data-settings='{ "id": "integrationpulse" }'>
	</div>
</body>
</html>
