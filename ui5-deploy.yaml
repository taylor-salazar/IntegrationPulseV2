specVersion: "3.0"
metadata:
  name: integration.pulse
type: application
framework:
  name: OpenUI5
  version: "1.120.20"
  libraries:
    - name: sap.f
    - name: sap.m
    - name: sap.tnt
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: integration-pulse-ui
        relativePaths: true
